name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.13.4"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4   # pyspark 단위 테스트(Silver 병합 로직)
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e '.[dev]'
      - run: ruff check p1 libs contracts scripts
      - run: ruff format --check p1 libs contracts scripts
      - run: pytest -q p1 libs contracts scripts
      - name: 데이터 계약 거버넌스(분류·보존 근거·소스 컬럼 전수 매핑)
        run: python -m contracts.governance
      - name: 접근 요청 검사(승인자 2명, 30일, 허용 범위)
        run: python -m p1.governance.access
      - name: 스키마·계약 호환성(기준 브랜치 대비, S-C1)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=50 origin ${{ github.base_ref }}
          python -m contracts.compat --base origin/${{ github.base_ref }}
      - name: 커넥터 설정·토픽 교차 검사
        run: python -m p1.cdc.lint && python -m p1.streaming.topics lint

  dbt:
    # 연결 없이 구문·참조·테스트 정의·시맨틱 레이어를 검사한다(parse). 실제 build 는 MWAA 가 VPC 안에서
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p1/dbt
    env:
      DBT_PROFILES_DIR: .
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'dbt-core==1.12.*' 'dbt-athena-community==1.11.*'
      - run: |
          dbt parse --no-partial-parse --warn-error-options '{"error": ["NoNodesForSelectionCriteria"]}'

  airflow:
    # 실제 Airflow 로 DAG 를 읽어 import 오류·순환·잘못된 연산자 사용을 잡는다(MWAA 와 같은 3.x 라인)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install "apache-airflow==3.0.6" apache-airflow-providers-amazon apache-airflow-providers-openlineage \
            apache-airflow-providers-common-messaging pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.0.6/constraints-3.12.txt"
      - run: pytest -q p1/orchestration/tests

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: fmt, validate, test (모든 스택·모듈)
        run: ./scripts/tf_validate_all.sh terraform

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          config_file: .checkov.yaml
          # P1 범위만 검사. 기존 지적은 기준선에 기록하고 새 지적만 실패시킨다
          # 기준선 재생성: checkov -d infra --config-file .checkov.yaml --skip-path 'stacks/p[23]-' --create-baseline
          skip_path: stacks/p[23]-
          baseline: infra/.checkov.baseline
          # 기존 지적은 기준선에 기록, 새 지적만 실패시킨다(재생성: checkov -d infra --config-file .checkov.yaml --create-baseline)

  plan:
    # PR 에서 바뀐 스택만 plan 한다. 결과는 잡 요약(Step Summary)에 남긴다.
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: [terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: backend.hcl
        run: |
          cat > infra/backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          region       = "ap-northeast-2"
          encrypt      = true
          kms_key_id   = "${{ vars.TF_STATE_KMS_KEY_ARN }}"
          use_lockfile = true
          EOF
      - name: 바뀐 스택 plan
        run: |
          for s in $(python3 scripts/changed_stacks.py origin/${{ github.base_ref }}); do
            echo "## plan: $s" >> "$GITHUB_STEP_SUMMARY"
            make init STACK=$s
            make plan STACK=$s
            (cd infra/stacks/$s && terraform show -no-color tfplan | tail -n 80) | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          done

  infracost:
    # 비용 차이를 PR 코멘트로 남긴다(INFRACOST_API_KEY 가 있을 때만)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: 키 확인
        id: key
        run: echo "present=${{ secrets.INFRACOST_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - if: steps.key.outputs.present == 'true'
        run: |
          infracost breakdown --path infra/stacks --format json --out-file /tmp/infracost.json \
            --terraform-var-file ../../envs/dev/common.tfvars
          infracost comment github --path /tmp/infracost.json --repo $GITHUB_REPOSITORY \
            --github-token ${{ github.token }} --pull-request ${{ github.event.pull_request.number }} --behavior update
