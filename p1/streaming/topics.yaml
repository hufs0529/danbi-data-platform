# 토픽 as code. `python -m p1.streaming.topics plan|apply`
# 원칙
#  - auto.create.topics.enable=false 이므로 여기에 없는 토픽은 존재할 수 없다
#  - 파티션은 늘릴 수만 있다(줄이면 키 → 파티션 매핑이 깨져 순서 보장이 무너진다). 도구가 감소를 거부한다
#  - 개인정보 원문이 있는 토픽은 보존을 파기 SLO(72시간) 안으로 둔다. 오래 보관할 원본은 Bronze(토큰화 후)다
#  - 파티션 수 근거: 클릭 피크 3,000건/초 ÷ 파티션당 컨슈머 실측 약 300건/초 ≈ 10 → 여유 두고 12 (부하 테스트 후 조정)

defaults:
  replication_factor: 2
  config:
    min.insync.replicas: "1"
    retention.ms: "172800000"      # 48h
    compression.type: "producer"

topics:
  # ----- CDC (Debezium). 키 = PK → 같은 행의 변경은 같은 파티션(순서 보장)
  - name: cdc.mysql.commerce.members
    partitions: 3
    pii: true
  - name: cdc.mysql.commerce.member_addresses
    partitions: 3
    pii: true
  - name: cdc.mysql.commerce.products
    partitions: 3
  - name: cdc.mysql.commerce.product_prices
    partitions: 3
  - name: cdc.mysql.commerce.coupons
    partitions: 1
  - name: cdc.mysql.commerce.orders
    partitions: 6
    pii: true
  - name: cdc.mysql.commerce.order_items
    partitions: 6
  - name: cdc.mysql.commerce.coupon_usages
    partitions: 3
    pii: true
  - name: cdc.mysql.commerce.cs_tickets
    partitions: 3
    pii: true
  - name: cdc.mysql.commerce.debezium_signal
    partitions: 1
  - name: cdc.pg.public.payments
    partitions: 6
    pii: true
  - name: cdc.pg.public.payment_status_history
    partitions: 6
  - name: cdc.pg.public.refunds
    partitions: 3
  - name: cdc.pg.public.debezium_signal
    partitions: 1

  # ----- Outbox 도메인 이벤트(키 = payment_key)
  - name: events.payment
    partitions: 6
    pii: true

  # ----- 클릭스트림
  - name: clicks.raw
    partitions: 12
    pii: true

  # ----- Debezium 내부. 스키마 이력은 지우면 커넥터가 재시작할 수 없다 → 무기한, 1파티션
  - name: schemahistory.mysql.commerce
    partitions: 1
    config:
      retention.ms: "-1"
      retention.bytes: "-1"
      cleanup.policy: "delete"
  # MSK Connect 오프셋을 우리가 이름 지은 토픽에 둔다 → 커넥터를 지우고 다시 만들어도 같은 위치에서 이어받는다
  - name: connect.offsets.cdc
    partitions: 6
    config:
      cleanup.policy: "compact"
      retention.ms: "-1"

  # ----- 처리 결과·운영
  - name: dlq.ingest
    partitions: 3
    pii: true          # 실패한 원문이 들어 있다 → 보존 72h, 재처리 도구는 S3 격리 버킷으로 옮긴다
    config:
      retention.ms: "259200000"
  - name: rt.sales_1m
    partitions: 3
    config:
      retention.ms: "604800000"
  - name: alerts.fraud
    partitions: 3
    config:
      retention.ms: "604800000"
